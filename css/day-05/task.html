<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header{
            background-color: crimson;
            height: 70px;
            display: flex;
            justify-content: center;

        }
        .logo{
            font-size: 30px;
            font-weight: 700;
            color: black;
        }
        nav{
            display:flex;
            justify-content: center;
            gap: 50px;
            align-items: center;
        }
        .links a{
            text-decoration: none;
            font-size: 20px;
            color: white;
            font-weight: 700;
        }
        .contentBox{
            width: 200px;
            height: 200px;
            background-color: greenyellow;
            margin: 12px;
            border-radius: 50%;
        }

        .container{
            width: 500px;
            height: 300px;
            border: 5px solid black;
            border-radius: 6px;
            margin: 10px;
        }
        .myBox{
            width: 100px;
            height: 100px;
            background-color: crimson;
            display: inline-block;
            margin: 10px;
        }
        .fixedBox{
            width: 150px;
            height: 150px;
            border: 3px solid black;
            margin: 10px;
            position: fixed;
            right: 0;
        }
        footer{
            text-align: center;
            position: absolute;
            bottom: 0;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                TasteBite
            </div>
            <div class="links">
                <a href="">Home</a>
                <a href="">About</a>
                <a href="">Contact Us</a>
            </div>
        </nav>
    </header>

    <main>
        <div class="contentBox">
        </div>

        <div class="container">
            <div class="myBox"></div>
            <div class="myBox"></div>
            <div class="myBox"></div>
        </div>

        <div class="fixedBox"></div>
    </main>

    <footer>
        <h3>This is my footer</h3>
    </footer>
</body>
</html>
