<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        width: 600px;
        height: 500px;
        background-color: crimson;
        display: flex;
        flex-direction: row;
        /* flex-direction: row-reverse;
        flex-direction: column;
        flex-direction: column-reverse;
        justify-content: flex-start;
        justify-content: flex-end; */
        justify-content: center;
        justify-content: space-between;
        justify-content: space-around;
        justify-content: center;
        align-items: center;
        align-items: flex-start;
        /* align-items: flex-start;
        align-items: flex-end; */
        /* flex-wrap: nowrap;
        flex-wrap: wrap; */
        /* align-content: center;
        align-content: flex-start;
        align-content: flex-end; */
      }
      .box {
        width: 50px;
        height: 120px;
        background-color: darkgoldenrod;
        border: 3px solid black;
        margin: 2px;
      }
      #boxOne {
        align-self: center;
        align-self: flex-end;
        align-self: flex-start;
        order: 2;
        flex-grow: 1;
      }
      #boxTwo {
        flex-shrink: 2;
        order: 1;
      }
      #boxThree {
        order: 5;
        flex-shrink: 3;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="boxOne">1</div>
      <div class="box" id="boxTwo">2</div>
      <div class="box" id="boxThree">3</div>

      <!--   
flex-grow: agr extra space hogi to wo item grow krega ye hoga.
flex-shrink: jb container chotta ho or items ka size bara ho to automatically hamara items shrink/chotta hojai ga. -->
    </div>
  </body>
</html>
