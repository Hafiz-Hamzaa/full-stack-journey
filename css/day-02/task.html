<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="stylle.css">
    <style>
        /* This is a element selector */
        h1{
            color: red;
        }
        #heading{
            color: purple;
        }
        .myDiv{
            background-color: greenyellow;
        }
        #myPara{
            background-color: red;
            color: white;
        }
        h2{
            color: brown;
        }
        #first,#second{
            background-color: aqua;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Hello World</h1>
    <div id="heading" style="color: green;">This is a Div</div>
    <div class="myDiv">This is another div</div>
    <p id="myPara">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Itaque, reiciendis?</p>
    <h2>Heading Two</h2>

    <div id="first">First Div</div>
    <div id="second">Second Div</div>
</body>
</html>
