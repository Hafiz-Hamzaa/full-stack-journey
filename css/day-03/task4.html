<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: crimson;
        }
        button{
            margin-top: 20px;
            padding: 15px 10px;
            margin: 100px;
            border-width: 4px;
            border-style: dotted;
            border-color: red;
            border-radius: 50%;
        }
        .myBox{
            width: 140px;
            height: 140px;
            background-color: chocolate;
            border: 4px solid black;
            margin: 20px;
            padding: 20px 30px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box"></div>
    <button>Click me</button>

    <div id="box-one" class="myBox">Box One</div>
    <div id="box-two" class="myBox">Box Two</div>
</body>
</html>
