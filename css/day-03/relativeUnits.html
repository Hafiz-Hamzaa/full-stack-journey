<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            width: 100%;
            height: 200px;
            background-color: crimson;
        }

        .child{
            width: 50%;
            height: 50%;
            background-color: chartreuse;
        }
    </style>
</head>
<body>
    <!-- Relative Units in CSS -->
    <div class="parent">
        <div class="child"></div>
    </div>
</body>
</html>
