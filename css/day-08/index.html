        .box{
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background-color: transparent;
            border: 3px solid transparent;
            margin: 30px;
            border-top: 5px solid blue;
            animation: spin 1s linear infinite ;
        }

        @keyframes spin {
            100%{
                transform: rotate(360deg);
            }
        }
