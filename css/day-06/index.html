<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 220px;
            height: 220px;
            background-color: crimson;
            border-radius: 10px;
        }

        @media (min-width:200px) and (max-width:400px) {
            .box{
                width: 400px;
                border: 4px solid black;
                background-color: chartreuse;
            }
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
