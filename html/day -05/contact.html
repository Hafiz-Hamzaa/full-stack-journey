<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
</head>
<body>

    <h1>User Registration Form</h1>

    <form action="#" method="post">
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="fullname" placeholder="Enter your full name" required>
            <br><br>

            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
            <br><br>

            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" placeholder="03XXXXXXXXX" required>
            <br><br>

            <label>Gender:</label><br>
            <input type="radio" name="gender" value="male"> Male
            <input type="radio" name="gender" value="female"> Female
            <input type="radio" name="gender" value="other"> Other
            <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Account Details</legend>

            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>
            <br><br>

            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <br><br>

            <label for="confirm">Confirm Password:</label><br>
            <input type="password" id="confirm" name="confirm_password" placeholder="Confirm password" required>
            <br><br>
        </fieldset>

        <br>

        <fieldset>
            <legend>Additional Information</legend>

            <label for="city">City:</label><br>
            <select id="city" name="city">
                <option value="">Select City</option>
                <option value="karachi">Karachi</option>
                <option value="lahore">Lahore</option>
                <option value="islamabad">Islamabad</option>
            </select>
            <br><br>

            <label for="message">About Yourself:</label><br>
            <textarea id="message" name="about" rows="4" cols="40" placeholder="Write something about yourself"></textarea>
            <br><br>

            <input type="checkbox" required>
            I agree to the Terms & Conditions
            <br><br>
        </fieldset>

        <br>

        <input type="submit" value="Register">
        <input type="reset" value="Clear Form">
    </form>

    <button><a href="./index.html">Back to Home</a></button>

</body>
</html>
